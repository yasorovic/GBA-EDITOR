name: Tests

# Se déclenche à CHAQUE poussée et sur chaque pull request — contrairement à
# release.yml, qui n'agit qu'au moment de publier. C'est la différence entre un
# garde-fou et un constat : une régression doit se voir au commit qui la crée,
# pas des semaines plus tard au moment d'empaqueter.
#
# Les pushs qui ne touchent que de la prose (docs/, README, ROADMAP, changelog…) ne
# lancent pas les tests : docs.yml construit et publie le site de son côté. Les motifs
# sont ordonnés, un motif positif placé après une exclusion réintègre le fichier : les
# deux fichiers de docs/ que des tests lisent vraiment restent donc couverts
# (tests/docs/test_lua_api_pages.py, tests/scripting/test_lua_subset.py). Un commit qui
# mêle doc et code lance toujours les tests. La liste est écrite deux fois : GitHub
# n'accepte pas `paths-ignore` avec réintégration, et on évite les ancres YAML.
on:
  push:
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!ROADMAP.md"
      - "!RELEASE_NOTES.md"
      - "!THIRD-PARTY-NOTICES.md"
      - "!AGENTS.md"
      - "!changelog/**"
      - "!licenses/**"
      - "!.github/workflows/docs.yml"
      - "docs/_gen/**"
      - "docs/scripting-reference.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!ROADMAP.md"
      - "!RELEASE_NOTES.md"
      - "!THIRD-PARTY-NOTICES.md"
      - "!AGENTS.md"
      - "!changelog/**"
      - "!licenses/**"
      - "!.github/workflows/docs.yml"
      - "docs/_gen/**"
      - "docs/scripting-reference.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # La même suite sur les deux systèmes livrés, en deux jobs côte à côte : un échec propre à
  # l'un (un segfault Qt sous Linux, un chemin sous Windows) se voit avec le nom du système.
  # `fail-fast: false` : un échec d'un côté n'interrompt pas l'autre.
  tests:
    name: Tests ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            timeout: 15
          - os: windows-latest
            label: Windows
            timeout: 40
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Le contrôle d'architecture importe l'éditeur, donc PyQt6, sur une
      # machine sans écran.
      QT_QPA_PLATFORM: offscreen
      # Ici, un test natif sauté est un ÉCHEC : c'est ce job qui porte la
      # garantie d'équivalence Python/C (cf. tests/text/test_text_layout_native.py).
      GBA_TESTS_REQUIRE_NATIVE: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 arrive en wheel, mais ses bibliothèques Qt réclament ces .so à
      # l'import — absents d'une image ubuntu sans bureau.
      - name: Installer les bibliothèques Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      - name: Installer les dépendances Python
        id: python-deps
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements.txt -r packaging/requirements-dev.txt

      # Le gcc des sondes natives sous Windows : celui de msys2 (ucrt64), comme en développement local.
      # Le msys2 du runner n'a que sa base ; `CC` le désigne (cf. tests/native_toolchain.py).
      - name: Installer gcc (msys2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc"
          if ($LASTEXITCODE -ne 0) { throw "installation de gcc échouée" }
          if (-not (Test-Path "C:\msys64\ucrt64\bin\gcc.exe")) { throw "gcc absent de C:\msys64\ucrt64\bin" }
          "CC=C:/msys64/ucrt64/bin/gcc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Ce contrôle existait déjà mais n'avait jamais tourné automatiquement, et
      # `--fresh` (un interpréteur neuf par module, seul moyen de voir une boucle
      # qui dépend de l'ordre d'import) n'était jamais lancé du tout.
      # Ruff et l'architecture ne dépendent pas du système : une fois, côté Linux.
      - name: Ruff (erreurs certaines)
        id: ruff
        if: runner.os == 'Linux'
        run: ruff check editor tools tests

      - name: Contrôle d'architecture
        id: architecture
        if: runner.os == 'Linux'
        run: python tools/check_architecture.py --fresh

      # `cc` existe sur ubuntu-latest, `CC` pointe le gcc msys2 sous Windows : la sonde qui
      # interroge le vrai gba_engine.h compile et s'exécute, donc l'équivalence est réellement
      # vérifiée ici : c'est le seul endroit où elle l'est à coup sûr.
      # Un échec de Ruff ou d'architecture laisse pytest tourner si ses dépendances
      # sont prêtes. Les erreurs d'installation sont déjà signalées par leurs étapes.
      - name: Tests
        id: pytest
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        # -vv : pyproject.toml pose déjà -q, qu'un -v seul annulerait. Un plantage de Qt (segfault) ne
        # nomme pas le test ; le dernier nom du journal le désigne.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m pytest tests -rs -vv --junitxml "$env:RUNNER_TEMP/pytest.xml"
          $code = $LASTEXITCODE
          "exit-code=$code" >> $env:GITHUB_OUTPUT
          exit $code

      - name: Publier le verdict pytest
        id: verdict
        if: ${{ !cancelled() && steps.pytest.outputs.exit-code != '' }}
        continue-on-error: true
        shell: bash
        env:
          PYTEST_EXIT: ${{ steps.pytest.outputs.exit-code }}
        run: python tools/ci_pytest.py "Tests ${{ matrix.label }}" "$PYTEST_EXIT"

      - name: Résumer les contrôles sans verdict pytest
        if: ${{ always() && (steps.verdict.outcome != 'success' || steps.ruff.outcome == 'failure' || steps.architecture.outcome == 'failure') }}
        continue-on-error: true
        shell: bash
        env:
          PYTEST_EXIT: ${{ steps.pytest.outputs.exit-code }}
          LABEL: ${{ matrix.label }}
          VERDICT: ${{ steps.verdict.outcome }}
          RUFF: ${{ steps.ruff.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
        run: |
          {
            if [ -z "$PYTEST_EXIT" ]; then
              echo "**Tests $LABEL : contrôle sans verdict.** Voir la première étape en échec ou interrompue."
            elif [ "$VERDICT" != success ]; then
              echo "**Tests $LABEL : résumé indisponible.** Voir le journal de pytest (code $PYTEST_EXIT)."
            fi
            if [ "$RUFF" = failure ]; then
              echo '- Ruff a échoué. Voir le journal de cette étape.'
            fi
            if [ "$ARCHITECTURE" = failure ]; then
              echo "- Le contrôle d'architecture a échoué. Voir le journal de cette étape."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Tests

# Se déclenche à CHAQUE poussée et sur chaque pull request — contrairement à
# release.yml, qui n'agit qu'au moment de publier. C'est la différence entre un
# garde-fou et un constat : une régression doit se voir au commit qui la crée,
# pas des semaines plus tard au moment d'empaqueter.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Le contrôle d'architecture importe l'éditeur, donc PyQt6, sur une
      # machine sans écran.
      QT_QPA_PLATFORM: offscreen
      # Ici, un test natif sauté est un ÉCHEC : c'est ce job qui porte la
      # garantie d'équivalence Python/C (cf. tests/text/test_text_layout_native.py).
      GBA_TESTS_REQUIRE_NATIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 arrive en wheel, mais ses bibliothèques Qt réclament ces .so à
      # l'import — absents d'une image ubuntu sans bureau.
      - name: Installer les bibliothèques Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Ce contrôle existait déjà mais n'avait jamais tourné automatiquement, et
      # `--fresh` (un interpréteur neuf par module, seul moyen de voir une boucle
      # qui dépend de l'ordre d'import) n'était jamais lancé du tout.
      - name: Contrôle d'architecture
        run: python tools/check_architecture.py --fresh

      # `cc` existe sur ubuntu-latest : la sonde qui interroge le vrai
      # gba_engine.h compile et s'exécute, donc l'équivalence est réellement
      # vérifiée ici — c'est le seul endroit où elle l'est à coup sûr.
      - name: Tests
        run: python -m pytest tests -q -rs

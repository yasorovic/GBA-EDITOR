name: Release builds

# Se déclenche quand tu publies une Release sur GitHub (tag + release notes
# via l'UI ou `gh release create`) : compile l'éditeur avec Nuitka, en tire
# un installateur NSIS + un ZIP portable, et les attache à cette release.
# `workflow_dispatch` permet aussi de lancer un build de test sans publier
# de release (les artefacts restent alors dans l'onglet Actions).
#
# Trois plateformes : l'installateur NSIS + le ZIP portable Windows, et
# l'AppImage Linux. La vraie distribution de test est le runner ubuntu-22.04
# (figé : il fixe la glibc minimale de l'AppImage) : un `workflow_dispatch`
# produit l'AppImage en artefact (onglet Actions) sans publier de release, pour
# la valider avant un vrai tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # La version vit dans le dépôt (editor/core/app_info.py) ; le tag de la
      # release la CONFIRME. Un tag qui diverge fait échouer la release ici, avant
      # les ~heures de compilation. Sans tag (workflow_dispatch), on prend celle
      # du dépôt.
      - id: v
        shell: bash
        run: |
          FILE_VERSION="$(python3 packaging/nuitka_build.py --print-version)"
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$FILE_VERSION" ]; then
            echo "::error::Le tag $TAG ne correspond pas à APP_VERSION ($FILE_VERSION) dans editor/core/app_info.py : alignez l'un sur l'autre."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

  # Les tests qui compilent un projet entier (`-m slow`, exclus de `tests.yml` et du
  # travail quotidien) tournent ici : avant les ~heures de compilation de l'éditeur.
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests lents
        run: python -m pytest tests -m slow -q -rs

  build-windows:
    needs: [version, slow-tests]
    runs-on: windows-latest
    # Nuitka compile en C : nettement plus long que l'ancien build
    # PyInstaller (qui ne faisait qu'assembler des .pyc).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le cache Nuitka (objets compilés + ccache) fait la différence entre
      # un build à froid et un build incrémental sur les runs suivants.
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\Nuitka\Nuitka\Cache'
          key: nuitka-windows-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-windows-${{ hashFiles('requirements.txt') }}-
            nuitka-windows-

      - name: Installer les dépendances Python
        run: |
          pip install -r requirements.txt
          pip install nuitka

      # Le runner part d'un Python nu : tout import du code que
      # requirements.txt ne couvre pas échoue ici, avant le build, au lieu
      # de produire une distribution qui plante à l'usage (cf. luaparser
      # en 1.0).
      - name: Vérifier que requirements.txt couvre tous les imports
        run: python packaging/check_deps.py

      - name: Build Nuitka (standalone)
        run: python packaging/nuitka_build.py --version "${{ needs.version.outputs.version }}" --output-dir build-out

      # Le binaire LIVRE démarre-t-il, crée-t-il un projet, ouvre-t-il chaque écran,
      # trouve-t-il ses données embarquées ? Les écrans sont importés paresseusement :
      # un module que Nuitka n'a pas vu n'échouerait qu'au premier clic d'un
      # utilisateur. Un échec ici arrête la release AVANT de publier.
      - name: Smoke test du binaire
        shell: pwsh
        run: |
          $report = Join-Path $PWD "smoke-report.txt"
          $p = Start-Process -FilePath "build-out\Backstage\Backstage.exe" `
                             -ArgumentList "--smoke-test=`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "smoke test du binaire en échec (code $($p.ExitCode))" }

      - name: ZIP portable
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "build-out\Backstage" `
                           -DestinationPath "Backstage-$version-windows-portable.zip"

      - name: Construire l'installateur NSIS
        shell: pwsh
        run: |
          # NSIS n'est plus garanti présent sur l'image windows-latest (il en a
          # disparu) : on le résout d'abord, et on l'installe via Chocolatey
          # (préinstallé sur ces runners) s'il manque, plutôt que de supposer
          # qu'il est là.
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) { $makensis = $candidate }
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) { $makensis = $candidate }
          }
          if (-not $makensis) { throw "makensis introuvable même après installation via choco" }

          $version = "${{ needs.version.outputs.version }}"
          $src     = (Resolve-Path "build-out\Backstage").Path
          $out     = Join-Path $PWD "Backstage-$version-windows-setup.exe"
          # VIProductVersion exige du numérique 4 champs, VERSION non.
          $vi = python -c "import sys; sys.path.insert(0, 'packaging'); from nuitka_build import numeric_version; print(numeric_version('$version'))"
          & $makensis "/DVERSION=$version" "/DVIVERSION=$vi" "/DSRCDIR=$src" "/DOUTFILE=$out" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué (code $LASTEXITCODE)" }

      # Le runner est une machine propre (ni Python ni devkitPro) : on y joue
      # l'installation, la mise à jour par-dessus, et la désinstallation, qui doit
      # épargner projets et configuration. Cf. packaging/windows/test_installer.ps1.
      - name: Tester l'installateur
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          ./packaging/windows/test_installer.ps1 -Installer (Join-Path $PWD "Backstage-$version-windows-setup.exe") -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Backstage-*-windows-setup.exe
            Backstage-*-windows-portable.zip

  build-linux-appimage:
    needs: [version, slow-tests]
    # Version figée, pas `ubuntu-latest` : l'AppImage exige au moins la glibc du
    # runner qui la construit. 22.04 (glibc 2.35) couvre aussi Debian 12 et
    # RHEL 9 ; `latest` (24.04, glibc 2.39) les exclurait.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système (Qt6 headless + compilateur)
        run: |
          sudo apt-get update
          # Le plugin de plateforme Qt "xcb" tire toute une famille de libs xcb :
          # elles doivent être présentes ICI pour que `ldd` les résolve et qu'on
          # les copie dans l'AppImage (étape « Assembler l'AppDir »). libxkbcommon-x11
          # et libxcb-xkb manquaient — sans elles libqxcb.so ne se charge pas.
          sudo apt-get install -y \
            patchelf ccache \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-xkb1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libnss3 libxdamage1 libfontconfig1 libpulse0

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-linux-${{ hashFiles('requirements.txt') }}-
            nuitka-linux-

      - name: Installer les dépendances Python
        run: |
          pip install -r requirements.txt
          pip install nuitka

      - name: Vérifier que requirements.txt couvre tous les imports
        run: python packaging/check_deps.py

      - name: Build Nuitka (standalone)
        run: python packaging/nuitka_build.py --version "${{ needs.version.outputs.version }}" --output-dir build-out

      # Même vérification que sous Windows, sur le binaire livré. Sous xvfb, avec
      # la vraie plateforme Qt « xcb » : c'est elle qui sera dans l'AppImage.
      - name: Smoke test du binaire
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a build-out/Backstage/Backstage --smoke-test="$PWD/smoke-report.txt" || status=$?
          cat smoke-report.txt || true
          exit "${status:-0}"

      - name: Récupérer appimagetool
        run: |
          curl -L -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Assembler l'AppDir
        run: |
          mkdir -p AppDir/usr/bin
          # Nuitka produit un dossier (standalone) et non un fichier unique :
          # on copie tout son contenu, exe + données + libs, dans usr/bin/.
          cp -r build-out/Backstage/. AppDir/usr/bin/
          # Le plugin de plateforme Qt "xcb" (libqxcb.so) dépend de toute une
          # famille de libs xcb/xkbcommon que Nuitka n'embarque PAS (elles sont
          # chargées par le plugin, hors de son scan) : sans elles, « Could not
          # load the Qt platform plugin xcb » et abandon au démarrage.
          # On copie la fermeture réelle — ce que ldd résout — plutôt qu'une liste
          # à la main : ldd donne les chemins par SONAME (le nom exact que
          # l'éditeur de liens réclame), et on saute ce que Nuitka a déjà posé.
          # Les libs atterrissent à côté des libs Nuitka, exposées par
          # LD_LIBRARY_PATH (AppRun).
          plugin="$(find AppDir/usr/bin -name libqxcb.so | head -1)"
          # Garde-fou : une dépendance « not found » sur le runner ne sera pas
          # copiée et l'AppImage sortirait cassé. On échoue le build ici, fort,
          # plutôt que de le découvrir au démarrage sur la machine d'un utilisateur
          # — le correctif étant d'ajouter le paquet manquant à l'étape apt.
          if ldd "$plugin" | grep -q "not found"; then
            echo "::error::Dépendances du plugin xcb non résolues sur le runner :"
            ldd "$plugin" | grep "not found"
            exit 1
          fi
          ldd "$plugin" | awk '/=> \// {print $3}' | while read -r lib; do
            base="$(basename "$lib")"
            [ -e "AppDir/usr/bin/$base" ] || cp -L "$lib" "AppDir/usr/bin/$base"
          done
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/Backstage
          cp packaging/linux/backstage.desktop AppDir/backstage.desktop
          cp packaging/icon.png AppDir/icon.png
          # Icône du fichier AppImage dans les gestionnaires de fichiers.
          cp packaging/icon.png AppDir/.DirIcon
          # Type MIME du manifeste <Nom>.project : c'est ce qui apprend au
          # bureau Linux que l'extension est connue, associee a l'editeur via le
          # MimeType du .desktop. Sans lui, le double-clic ne trouve aucune appli.
          mkdir -p AppDir/usr/share/mime/packages
          cp packaging/linux/backstage-project.xml AppDir/usr/share/mime/packages/backstage-project.xml

      - name: Construire l'AppImage
        run: |
          # --appimage-extract-and-run évite la dépendance à libfuse2, absente
          # par défaut des runners GitHub-hosted récents.
          VERSION="${{ needs.version.outputs.version }}"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Backstage-${VERSION}-x86_64.AppImage"

      # On livre l'AppImage DANS un .tar.gz : un .zip (ou un téléchargement direct)
      # perd le bit exécutable, et l'utilisateur Linux doit alors faire un chmod +x
      # avant que le double-clic fonctionne. tar le conserve ; extraire l'archive
      # suffit.
      - name: Archiver l'AppImage (conserve le droit d'exécution)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          tar -czf "Backstage-${VERSION}-x86_64.AppImage.tar.gz" "Backstage-${VERSION}-x86_64.AppImage"
          tar -tvzf "Backstage-${VERSION}-x86_64.AppImage.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "*.AppImage.tar.gz"

  publish:
    if: github.event_name == 'release'
    needs: [build-windows, build-linux-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Les deux artefacts tombent à plat dans le même dossier (chacun ne
      # contient que des fichiers, pas de sous-arbre), pour un seul upload.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts

      - name: Attacher les artefacts à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber --repo "${{ github.repository }}"

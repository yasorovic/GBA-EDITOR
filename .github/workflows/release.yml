name: Release builds

# Se déclenche quand tu publies une Release sur GitHub (tag + release notes
# via l'UI ou `gh release create`) : compile l'éditeur avec Nuitka, en tire
# un installateur NSIS + un ZIP portable, et les attache à cette release.
# `workflow_dispatch` permet aussi de lancer un build de test sans publier
# de release (les artefacts restent alors dans l'onglet Actions).
#
# Trois plateformes : l'installateur NSIS + le ZIP portable Windows, et
# l'AppImage Linux. La vraie distribution de test est le runner ubuntu-22.04
# (figé : il fixe la glibc minimale de l'AppImage) : un `workflow_dispatch`
# produit l'AppImage en artefact (onglet Actions) sans publier de release, pour
# la valider avant un vrai tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # La version vit dans le dépôt (editor/core/app_info.py) ; le tag de la
      # release la CONFIRME. Un tag qui diverge fait échouer la release ici, avant
      # les ~heures de compilation. Sans tag (workflow_dispatch), on prend celle
      # du dépôt.
      - id: v
        shell: bash
        env:
          # Par l'environnement, pas collé dans le script : un tag contenant `"` ou `$(…)`
          # s'exécuterait sinon dans le job.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          FILE_VERSION="$(python3 packaging/nuitka_build.py --print-version)"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$FILE_VERSION" ]; then
            echo "::error::Le tag $TAG ne correspond pas à APP_VERSION ($FILE_VERSION) dans editor/core/app_info.py : alignez l'un sur l'autre."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      # `packaging/update.json` dit si cette version mérite une pop-up au lancement
      # (cf. core/update_check.py) ; un fichier invalide échoue ici, avant la compilation.
      - name: Valider update.json
        run: >
          PYTHONPATH=editor python3 -c
          "import json; from core.update_check import parse_importance;
          parse_importance(json.load(open('packaging/update.json')))"

  # Les mêmes contrôles que `tests.yml`, rejoués sur le commit EXACT du tag publié : une CI
  # verte sur une poussée antérieure ne dit rien du commit qui part en release. Un échec ici
  # arrête tout, avant les ~heures de compilation de l'éditeur.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      GBA_TESTS_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques Qt
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Contrôle d'architecture
        run: python tools/check_architecture.py --fresh

      - name: Tests
        run: python -m pytest tests -q -rs

  # Le build de ROM sous Windows : msys2 de devkitPro, chemins C:\devkitPro, limite de
  # 260 caractères, relance de `make` — du code qui ne tournait que sur le poste de
  # l'auteur. Hors `needs` des builds tant qu'il n'a pas passé un workflow_dispatch :
  # l'installation silencieuse de devkitPro (`/S`) n'a pas encore été vérifiée sur un
  # runner. Une fois verte, ajouter `windows-rom-build` aux `needs` de build-windows.
  windows-rom-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      GBA_TESTS_REQUIRE_DEVKITPRO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # devkitProUpdater (l'installateur graphique de l'utilisateur) ne fait rien en
      # silencieux (`/S`) : on passe par le dépôt pacman de devkitPro dans le msys2 du
      # runner, comme sur Linux. Les outils atterrissent dans C:\msys64\opt\devkitpro, exposé en C:\devkitPro.
      # `pkg.devkitpro.org` répond parfois 403 (Cloudflare) : une installation réussie est
      # gardée en cache et sert tant que la clé ne change pas (changer `v1` pour la refaire).
      - name: Restaurer devkitPro
        id: dkp-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\msys64\opt\devkitpro
          key: devkitpro-gba-windows-v1

      - name: Installer devkitPro
        if: steps.dkp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sh = "C:\msys64\usr\bin\bash.exe"
          & $sh -lc @'
          set -e
          # Les bases sont signées par WinterMute (BC26…) et par fincs (032F…).
          for key in BC26F752D25B92CE272E0F44F7FD5492264BB9D0 032F4C9D0B8FF3BC84019B7862C7609ADA219C60; do
            pacman-key --recv $key --keyserver keyserver.ubuntu.com
            pacman-key --lsign $key
          done
          printf '\n[dkp-libs]\nServer = https://pkg.devkitpro.org/packages\n\n[dkp-windows]\nServer = https://pkg.devkitpro.org/packages/windows/$arch\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm
          pacman -S --noconfirm gba-dev
          '@
          if ($LASTEXITCODE -ne 0) { throw "installation de gba-dev échouée" }
          if (-not (Test-Path "C:\msys64\opt\devkitpro\devkitARM\bin\arm-none-eabi-gcc.exe")) { throw "devkitPro (GBA) n'est pas installé" }

      - name: Garder devkitPro en cache
        if: steps.dkp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\msys64\opt\devkitpro
          key: devkitpro-gba-windows-v1

      - name: Exposer devkitPro en C:\devkitPro
        shell: pwsh
        run: |
          $root = "C:\msys64\opt\devkitpro"
          if (-not (Test-Path "$root\devkitARM\bin\arm-none-eabi-gcc.exe")) { throw "devkitPro (GBA) absent de $root" }
          # Même disposition que l'installateur graphique : C:\devkitPro\{devkitARM,tools,…}
          # et C:\devkitPro\msys2 (le make que cherche core.toolchain). Des jonctions, pas
          # une copie ; C:\devkitPro est un vrai dossier pour éviter un cycle msys2 -> opt.
          # Le msys2 du runner n'a pas `make` (devkitPro apporte le sien) ; dépôt msys2
          # normal, pas celui de devkitPro. Hors cache : `make` vit dans C:\msys64.
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make"
          if ($LASTEXITCODE -ne 0) { throw "installation de make échouée" }
          New-Item -ItemType Directory C:\devkitPro | Out-Null
          Get-ChildItem $root -Directory | ForEach-Object {
            New-Item -ItemType Junction -Path "C:\devkitPro\$($_.Name)" -Target $_.FullName | Out-Null
          }
          New-Item -ItemType Junction -Path C:\devkitPro\msys2 -Target C:\msys64 | Out-Null
          if (-not (Test-Path "C:\devkitPro\devkitARM\bin\arm-none-eabi-gcc.exe")) { throw "disposition C:\devkitPro incomplète" }
          if (-not (Test-Path "C:\devkitPro\msys2\usr\bin\make.exe")) { throw "make manquant dans C:\devkitPro\msys2" }
          "DEVKITPRO=C:\devkitPro" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DEVKITARM=C:\devkitPro\devkitARM" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Tests lents
        run: python -m pytest tests -m slow -q -rs

  build-windows:
    needs: [version, tests]
    runs-on: windows-latest
    # Nuitka compile en C : nettement plus long que l'ancien build
    # PyInstaller (qui ne faisait qu'assembler des .pyc).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le cache Nuitka (objets compilés + ccache) fait la différence entre
      # un build à froid et un build incrémental sur les runs suivants.
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\Nuitka\Nuitka\Cache'
          key: nuitka-windows-${{ hashFiles('requirements.txt', 'packaging/requirements-build.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-windows-${{ hashFiles('requirements.txt', 'packaging/requirements-build.txt') }}-
            nuitka-windows-

      - name: Installer les dépendances Python
        run: |
          pip install -r requirements.txt -r packaging/requirements-build.txt

      # Le runner part d'un Python nu : tout import du code que
      # requirements.txt ne couvre pas échoue ici, avant le build, au lieu
      # de produire une distribution qui plante à l'usage (cf. luaparser
      # en 1.0).
      - name: Vérifier que requirements.txt couvre tous les imports
        run: python packaging/check_deps.py

      - name: Build Nuitka (standalone)
        run: python packaging/nuitka_build.py --version "${{ needs.version.outputs.version }}" --output-dir build-out

      # Le binaire LIVRE démarre-t-il, crée-t-il un projet, ouvre-t-il chaque écran,
      # trouve-t-il ses données embarquées ? Les écrans sont importés paresseusement :
      # un module que Nuitka n'a pas vu n'échouerait qu'au premier clic d'un
      # utilisateur. Un échec ici arrête la release AVANT de publier.
      - name: Smoke test du binaire
        shell: pwsh
        run: |
          $report = Join-Path $PWD "smoke-report.txt"
          $p = Start-Process -FilePath "build-out\Backstage\Backstage.exe" `
                             -ArgumentList "--smoke-test=`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "smoke test du binaire en échec (code $($p.ExitCode))" }

      - name: ZIP portable
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "build-out\Backstage" `
                           -DestinationPath "Backstage-$version-windows-portable.zip"

      - name: Construire l'installateur NSIS
        shell: pwsh
        run: |
          # NSIS n'est plus garanti présent sur l'image windows-latest (il en a
          # disparu) : on le résout d'abord, et on l'installe via Chocolatey
          # (préinstallé sur ces runners) s'il manque, plutôt que de supposer
          # qu'il est là.
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) { $makensis = $candidate }
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (Test-Path $candidate) { $makensis = $candidate }
          }
          if (-not $makensis) { throw "makensis introuvable même après installation via choco" }

          $version = "${{ needs.version.outputs.version }}"
          $src     = (Resolve-Path "build-out\Backstage").Path
          $out     = Join-Path $PWD "Backstage-$version-windows-setup.exe"
          # VIProductVersion exige du numérique 4 champs, VERSION non.
          $vi = python -c "import sys; sys.path.insert(0, 'packaging'); from nuitka_build import numeric_version; print(numeric_version('$version'))"
          & $makensis "/DVERSION=$version" "/DVIVERSION=$vi" "/DSRCDIR=$src" "/DOUTFILE=$out" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué (code $LASTEXITCODE)" }

      # Le runner est une machine propre (ni Python ni devkitPro) : on y joue
      # l'installation, la mise à jour par-dessus, et la désinstallation, qui doit
      # épargner projets et configuration. Cf. packaging/windows/test_installer.ps1.
      - name: Tester l'installateur
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          ./packaging/windows/test_installer.ps1 -Installer (Join-Path $PWD "Backstage-$version-windows-setup.exe") -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Backstage-*-windows-setup.exe
            Backstage-*-windows-portable.zip

  build-linux-appimage:
    needs: [version, tests]
    # Version figée, pas `ubuntu-latest` : l'AppImage exige au moins la glibc du
    # runner qui la construit. 22.04 (glibc 2.35) couvre aussi Debian 12 et
    # RHEL 9 ; `latest` (24.04, glibc 2.39) les exclurait.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système (Qt6 headless + compilateur)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          # Le plugin de plateforme Qt "xcb" tire toute une famille de libs xcb :
          # elles doivent être présentes ICI pour que `ldd` les résolve et qu'on
          # les copie dans l'AppImage (étape « Assembler l'AppDir »). libxkbcommon-x11
          # et libxcb-xkb manquaient — sans elles libqxcb.so ne se charge pas.
          sudo apt-get install -y \
            patchelf ccache \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-xkb1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libnss3 libxdamage1 libfontconfig1 libpulse0

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('requirements.txt', 'packaging/requirements-build.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-linux-${{ hashFiles('requirements.txt', 'packaging/requirements-build.txt') }}-
            nuitka-linux-

      - name: Installer les dépendances Python
        run: |
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Vérifier que requirements.txt couvre tous les imports
        run: python packaging/check_deps.py

      - name: Build Nuitka (standalone)
        run: python packaging/nuitka_build.py --version "${{ needs.version.outputs.version }}" --output-dir build-out

      # Même vérification que sous Windows, sur le binaire livré. Sous xvfb, avec
      # la vraie plateforme Qt « xcb » : c'est elle qui sera dans l'AppImage.
      - name: Smoke test du binaire
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a build-out/Backstage/Backstage --smoke-test="$PWD/smoke-report.txt" || status=$?
          cat smoke-report.txt || true
          exit "${status:-0}"

      - name: Récupérer appimagetool
        run: |
          # Version numérotée (1.9.1), pas `continuous` : ce tag est reconstruit en amont et son empreinte changerait.
          # Empreinte épinglée, comme celles de devkitPro et mGBA dans installer.nsi :
          # un fichier remplacé en amont fait échouer le build au lieu de partir en release.
          curl -fL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool

      - name: Assembler l'AppDir
        run: |
          mkdir -p AppDir/usr/bin
          # Nuitka produit un dossier (standalone) et non un fichier unique :
          # on copie tout son contenu, exe + données + libs, dans usr/bin/.
          cp -r build-out/Backstage/. AppDir/usr/bin/
          # Le plugin de plateforme Qt "xcb" (libqxcb.so) dépend de toute une
          # famille de libs xcb/xkbcommon que Nuitka n'embarque PAS (elles sont
          # chargées par le plugin, hors de son scan) : sans elles, « Could not
          # load the Qt platform plugin xcb » et abandon au démarrage.
          # On copie la fermeture réelle — ce que ldd résout — plutôt qu'une liste
          # à la main : ldd donne les chemins par SONAME (le nom exact que
          # l'éditeur de liens réclame), et on saute ce que Nuitka a déjà posé.
          # Les libs atterrissent à côté des libs Nuitka, exposées par
          # LD_LIBRARY_PATH (AppRun).
          plugin="$(find AppDir/usr/bin -name libqxcb.so | head -1)"
          # Garde-fou : une dépendance « not found » sur le runner ne sera pas
          # copiée et l'AppImage sortirait cassé. On échoue le build ici, fort,
          # plutôt que de le découvrir au démarrage sur la machine d'un utilisateur
          # — le correctif étant d'ajouter le paquet manquant à l'étape apt.
          if ldd "$plugin" | grep -q "not found"; then
            echo "::error::Dépendances du plugin xcb non résolues sur le runner :"
            ldd "$plugin" | grep "not found"
            exit 1
          fi
          # JAMAIS la glibc : elle appartient au système de l'utilisateur. AppRun place
          # usr/bin en tête de LD_LIBRARY_PATH, donc une libc.so.6 embarquée (ici
          # celle du runner, 2.35) passe avant celle du système (2.39 sur Ubuntu
          # 24.04) et mélange deux versions avec son ld-linux : segfault immédiat,
          # sans un message. La CI ne le voit pas, le runner ayant la même glibc.
          # La liste est celle de la « excludelist » d'AppImage pour le noyau glibc.
          ldd "$plugin" | awk '/=> \// {print $3}' | while read -r lib; do
            base="$(basename "$lib")"
            case "$base" in
              ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libutil.so*|libnsl.so*|libanl.so*) continue ;;
            esac
            [ -e "AppDir/usr/bin/$base" ] || cp -L "$lib" "AppDir/usr/bin/$base"
          done
          # Nuitka ou une copie antérieure peut en avoir posé : on retire, puis on
          # vérifie qu'il n'en reste aucune.
          rm -f AppDir/usr/bin/ld-linux*.so* AppDir/usr/bin/libc.so* AppDir/usr/bin/libm.so* \
                AppDir/usr/bin/libdl.so* AppDir/usr/bin/libpthread.so* AppDir/usr/bin/librt.so* \
                AppDir/usr/bin/libresolv.so* AppDir/usr/bin/libutil.so*
          if ls AppDir/usr/bin/ | grep -E '^(ld-linux.*|libc\.so.*|libm\.so.*|libdl\.so.*|libpthread\.so.*|librt\.so.*|libresolv\.so.*|libutil\.so.*)$'; then
            echo "::error::La glibc est dans l'AppImage (voir ci-dessus) : elle casserait le démarrage sur une distribution plus récente que le runner."
            exit 1
          fi
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/Backstage
          cp packaging/linux/backstage.desktop AppDir/backstage.desktop
          cp packaging/icon.png AppDir/icon.png
          # Icône du fichier AppImage dans les gestionnaires de fichiers.
          cp packaging/icon.png AppDir/.DirIcon
          # Type MIME du manifeste <Nom>.project : c'est ce qui apprend au
          # bureau Linux que l'extension est connue, associee a l'editeur via le
          # MimeType du .desktop. Sans lui, le double-clic ne trouve aucune appli.
          mkdir -p AppDir/usr/share/mime/packages
          cp packaging/linux/backstage-project.xml AppDir/usr/share/mime/packages/backstage-project.xml

      - name: Construire l'AppImage
        run: |
          # --appimage-extract-and-run évite la dépendance à libfuse2, absente
          # par défaut des runners GitHub-hosted récents.
          VERSION="${{ needs.version.outputs.version }}"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Backstage-${VERSION}-x86_64.AppImage"

      # Le smoke test plus haut tourne sur le dossier Nuitka ; celui-ci lance le FICHIER
      # livré : AppRun, les libs xcb copiées, l'exclusion de la glibc. Une AppImage
      # cassée échoue ici, avant d'être publiée. --appimage-extract-and-run : pas de FUSE
      # sur le runner ; les arguments suivants vont à l'éditeur.
      - name: Smoke test de l'AppImage
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          xvfb-run -a "./Backstage-${VERSION}-x86_64.AppImage" --appimage-extract-and-run \
            --smoke-test="$PWD/smoke-appimage.txt" || status=$?
          cat smoke-appimage.txt || true
          exit "${status:-0}"

      # On livre l'AppImage DANS un .tar.gz : un .zip (ou un téléchargement direct)
      # perd le bit exécutable, et l'utilisateur Linux doit alors faire un chmod +x
      # avant que le double-clic fonctionne. tar le conserve ; extraire l'archive
      # suffit.
      - name: Archiver l'AppImage (conserve le droit d'exécution)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          tar -czf "Backstage-${VERSION}-x86_64.AppImage.tar.gz" "Backstage-${VERSION}-x86_64.AppImage"
          tar -tvzf "Backstage-${VERSION}-x86_64.AppImage.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "*.AppImage.tar.gz"

  publish:
    if: github.event_name == 'release'
    needs: [build-windows, build-linux-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Les deux artefacts tombent à plat dans le même dossier (chacun ne
      # contient que des fichiers, pas de sous-arbre), pour un seul upload.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts

      # L'éditeur vérifie son téléchargement contre ce fichier (core/update_install.py) :
      # une release sans SHA256SUMS ne peut pas être installée depuis l'éditeur.
      - name: Empreintes SHA-256
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Attacher les artefacts à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/* packaging/update.json --clobber --repo "${{ github.repository }}"

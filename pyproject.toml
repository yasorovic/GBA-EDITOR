# Backstage est distribué par Nuitka, et non comme paquet pip : ce fichier
# centralise donc la configuration des outils, sans dupliquer les métadonnées
# ou les dépendances de requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs -m 'not slow'"
markers = [
    "slow: construit un vrai projet de bout en bout avec devkitPro (quelques minutes) ; exclus par défaut, `pytest -m slow` les lance",
    "native: compile et exécute une sonde C avec le compilateur de la machine (posé par tests/conftest.py)",
    "ui: instancie de vrais widgets Qt hors écran (posé par tests/conftest.py)",
]

# Ruff ne lit que les erreurs qui plantent à coup sûr (syntaxe, comparaisons et
# constructions invalides) : base à zéro faute le 2026-10-19. Les noms indéfinis
# sont déjà vérifiés par tools/check_architecture.py (ruff y voit à tort les
# annotations en chaîne) ; imports inutilisés et variables mortes (F401, F841,
# ~200 relevés) sont laissés de côté tant qu'ils ne sont pas nettoyés.
[tool.ruff.lint]
select = ["E9", "F63", "F7"]

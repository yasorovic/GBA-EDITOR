# Backstage est distribué par Nuitka, et non comme paquet pip : ce fichier
# centralise donc la configuration des outils, sans dupliquer les métadonnées
# ou les dépendances de requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"
markers = [
    "slow: construit un vrai projet de bout en bout (quelques minutes) ; `-m \"not slow\"` pour les sauter",
]
